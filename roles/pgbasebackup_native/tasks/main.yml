---
- name: default PGDATA stat
  ansible.builtin.set_fact:
    pgbinbkp_pgdata_stat:
      stat:
        isdir: false

- name: check PGDATA
  ansible.builtin.stat:
    path: "{{ pgbinbkp_pgdata }}"
  register: pgbinbkp_pgdata_stat
  when: pgbinbkp_pgdata | default('') | length > 0

- name: require pgbinbkp_pgdata
  ansible.builtin.assert:
    that:
      - pgbinbkp_pgdata | default('') | length > 0
      - pgbinbkp_pgdata_stat.stat.isdir | default(false)
    fail_msg: >-
      pgbinbkp_pgdata must point to the PostgreSQL data directory on the
      target host (for example /var/lib/postgresql/16/main).
    quiet: true

- name: require pgbinbkp_pgpass
  ansible.builtin.assert:
    that:
      - pgbinbkp_pgpass | default('') | length > 0
    fail_msg: >-
      pgbinbkp_pgpass is empty. Pass the PostgreSQL password from
      vault/secret manager.
    quiet: true

- name: create directories
  file:
    path:  "{{ item.path  }}"
    state: "{{ item.state }}"
    mode:  "{{ item.mode  }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
  loop:
    - { path: "{{ pgbinbkp_data_path }}", state: directory, mode: "0700", owner: "root", group: "root" }
    - { path: "{{ pgbinbkp_log_name  }}", state: file,      mode: "0640", owner: "root", group: "root" }

- name: install script
  ansible.builtin.template:
    src:   "script.sh.j2"
    dest:  "{{ pgbinbkp_bin_name }}"
    mode:  "0700"
    owner: "root"
    group: "root"
  no_log: true

- name: create cron task
  cron:
    name:   "pg_basebackup job {{ pgbinbkp_jobname }}"
    minute: "{{ pgbinbkp_cron_minute }}"
    hour:   "{{ pgbinbkp_cron_hour }}"
    job:    "{{ pgbinbkp_bin_name }} >>{{ pgbinbkp_log_name }} 2>&1"

- name: logrotate configure
  template:
    src:   "logrotate.j2"
    dest:  "/etc/logrotate.d/{{ pgbinbkp_jobname }}"
    mode:  0644
    owner: "root"
    group: "root"

